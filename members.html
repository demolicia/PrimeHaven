<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members Page</title>

    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
     <script src="bootstrap/js/bootstrap.min.js"></script>
</head>
<body>
    <h1 class="text-center text-primary mb-3">New Member Registration</h1>

    <form class="bg-primary-subtle m-5 p-5 " action="">
        <div class="mb-4">
            <label for="fname" class="form-label">Fullname</label>
            <input type="text" id="fname" placeholder="eg.Mark Cuban" class="form-control">


        </div>

        <div class="mb-4">
            <label for="email" class="form-label">Email </label>
            <input type="email" id="email" class="form-control" placeholder="markcuban@gmail.com">


        </div>

              <div class="mb-4">
            <label for="Address" class="form-label">Address</label>
            <input  type="number" id="Address" placeholder="eg.342" class="form-control">


        </div>

              <div class="mb-4">
            <label for="phone" class="form-label">Phone No.</label>
            <input type="tel" id="phone" placeholder="+2547123456" class="form-control">


        </div>
        <div>
            <button class="btn btn-outline-dark" type="submit">Submit</button><button class="btn btn-outline-dark type="reset">Reset</button>
        </div>





    </form>







    
</body>
</html>
