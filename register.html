<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Page</title>
  <link rel="stylesheet" href="CSS/register.css">

</head>
<body>

  <form action="">


    <legend><marquee behavior="" direction="">Join Us and start you journey Today!</marquee></legend>
    <br><br>


    <label for=""> First Name</label>

    <input type="text"    id="Fname" placeholder="e.g Sahal "  required>
   

    <br><br>


    <label for="fname"> Surname</label>

    <input type="text"  id="sname" placeholder="e.g Mussa" required >


    <br><br>

    <label for="Email"> Email Address:</label>

    <input type="email"  id="Email" placeholder="e.g abc@gmail.com" required >


    <br><br>
    
    <label for="Password"> Enter passsword</label>

    <input type="password"  id="Password" placeholder="e.g Admin@123" required >
     
    

    <br><br>
    <label for="fname"> Enter height :</label>

    <input type="number"  id="height" placeholder="e.g 1.75 cm" required >


    <br><br>

    <label for="yob"> Year of Birth:</label>

    <input type="date"  id="yob" placeholder required >


    <br><br>



    <label for="dt"> Date and Time:</label>

    <input type="datetime-local"  id="dt"  required >


    <br><br>

    <label for="upload"> Image:</label>

    <input type="file"  id="upload" placeholder required >


    <br><br>

    <label for="yos"> Select Year of Study:</label>
    <select name="" id="yos">

      <!---dropdown-->

      <option value="" disabled>---select One---</option>

      <option value="">Year 1</option>
      <option value="">Year 2</option>
      <option value="" disabled>Year 3</option>
      <option value="">Year 4</option>


    </select>

    <!---end of dropdown-->



    <br><br>

    <!----Radio Button for selecting 1 answer-->
    <label>Choose favorite football team:</label><br>
    <input type="radio" id="Chelsea" name="team">
    <label for="Chelsea">Chelsea</label><br>
    <input type="radio" id="Arsenal" name="team">
    <label for="Arsenal">Arsenal</label><br>
    <input type="radio" id="Liverpool" name="team">
    <label for="Liverpool">Liverpool</label><br><br>

    <!----checkbox for selecting more than 1 answer-->
    <label for="">select Language</label><br>
    <input type="checkbox" id="Kiswahili" name="Kiswahili">
    <label for="Kiswahili">Kiswahili</label><br>

    <input type="checkbox" id="English" name="English">
    <label for="English">English</label><br>
    <input type="checkbox" id="German" name="German">
    <label for="German">German</label><br>

    <label for="Message">Message</label><br>
    <textarea name="" id="" cols="40" rows="10"></textarea><b></b><b></b><b>
      

   



    <br><br>
  


     <button>Register</button>
    


    
    
    
    
    
    




   
   








  </form>





  
</body>
</html>
